<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revit OBJ to Google Earth GLB Converter</title>
    <!-- Google Model Viewer Component for In-Browser 3D / AR Preview -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --dropzone-bg: #f9fafb;
            --dropzone-hover: #eef2ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 10px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 480px;
            max-width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        h2 {
            margin-top: 0;
            font-size: 1.4rem;
            color: var(--primary);
            letter-spacing: -0.025em;
        }

        .field-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Drag and Drop Box Styling */
        .drop-zone {
            border: 2px dashed var(--border-color);
            background: var(--dropzone-bg);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background: var(--dropzone-hover);
        }

        .drop-zone input[type="file"] {
            display: none;
        }

        .drop-zone-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        .drop-zone-text strong {
            color: var(--primary);
        }

        select, input[type="range"] {
            width: 100%;
            background: #f9fafb;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            background: #f9fafb;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .checkbox-group input {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
            color: var(--text-main);
            font-weight: 500;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
        }

        .secondary-btn {
            background-color: var(--success);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            margin-top: 12px;
        }
        .secondary-btn:hover {
            background-color: var(--success-hover);
        }

        #status {
            margin-top: 15px;
            font-size: 0.85rem;
            word-wrap: break-word;
            color: var(--primary);
            font-weight: 500;
            text-align: center;
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .range-container span {
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: bold;
            min-width: 35px;
        }

        /* Viewer Container styling */
        #viewerContainer {
            display: none;
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        model-viewer {
            width: 100%;
            height: 320px;
            background-color: #111;
            border-radius: 8px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

<div class="card">
    <h2>Revit to Google Earth GLB</h2>
    
    <div class="field-group">
        <label>1. Select OBJ File (*.obj):</label>
        <div class="drop-zone" id="objDropZone">
            <span class="drop-zone-text" id="objText"><strong>Click to browse</strong> or drag & drop .obj here</span>
            <input type="file" id="objInput" accept=".obj">
        </div>
    </div>

    <div class="field-group">
        <label>2. Select MTL File (Optional):</label>
        <div class="drop-zone" id="mtlDropZone">
            <span class="drop-zone-text" id="mtlText"><strong>Click to browse</strong> or drag & drop .mtl here</span>
            <input type="file" id="mtlInput" accept=".mtl">
        </div>
    </div>

    <div class="field-group">
        <label>3. Select Texture Maps (Optional):</label>
        <div class="drop-zone" id="imgDropZone">
            <span class="drop-zone-text" id="imgText"><strong>Click to browse</strong> or drag & drop images here</span>
            <input type="file" id="imgInput" accept="image/*" multiple>
        </div>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

    <div class="field-group">
        <label for="brightness">Brightness Multiplier (Fixes Revit Dark Models):</label>
        <div class="range-container">
            <input type="range" id="brightness" min="1.0" max="3.0" step="0.1" value="1.5">
            <span id="brightnessValue">1.5x</span>
        </div>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="unlitToggle">
        <label for="unlitToggle">Make Materials Unlit (Self-Illuminated for GIS)</label>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="doubleSideToggle" checked>
        <label for="doubleSideToggle">Fix Missing Back-Faces (Double Sided)</label>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="rotateToggle" checked>
        <label for="rotateToggle">Fix Rotation (-90° X-Axis for glTF)</label>
    </div>

    <button id="convertBtn">Export & Preview GLB</button>

    <div id="status"></div>

    <!-- Hidden Viewer and Download Section shown after conversion -->
    <div id="viewerContainer">
        <label style="margin-bottom: 8px;">4. Interactive 3D Preview & AR:</label>
        <model-viewer id="modelViewer" src="" alt="Converted Revit Model" auto-rotate camera-controls shadow-intensity="1" ar></model-viewer>
        <button id="downloadBtn" class="secondary-btn">Download .glb File</button>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const objInput = document.getElementById('objInput');
    const mtlInput = document.getElementById('mtlInput');
    const imgInput = document.getElementById('imgInput');
    
    const objText = document.getElementById('objText');
    const mtlText = document.getElementById('mtlText');
    const imgText = document.getElementById('imgText');

    const brightnessInput = document.getElementById('brightness');
    const brightnessValue = document.getElementById('brightnessValue');
    const unlitToggle = document.getElementById('unlitToggle');
    const doubleSideToggle = document.getElementById('doubleSideToggle');
    const rotateToggle = document.getElementById('rotateToggle');
    const convertBtn = document.getElementById('convertBtn');
    const statusDiv = document.getElementById('status');
    
    const viewerContainer = document.getElementById('viewerContainer');
    const modelViewer = document.getElementById('modelViewer');
    const downloadBtn = document.getElementById('downloadBtn');

    let generatedBlobUrl = null;
    let outputFileName = "model.glb";

    brightnessInput.addEventListener('input', () => {
        brightnessValue.textContent = `${brightnessInput.value}x`;
    });

    // Clean drop zone handler linking box clicks and file drops directly
    function setupDropZone(dropZoneId, inputEl, labelEl, isMultiple = false) {
        const zone = document.getElementById(dropZoneId);

        zone.addEventListener('click', () => {
            inputEl.click();
        });

        inputEl.addEventListener('change', () => {
            if (inputEl.files.length > 0) {
                if (isMultiple) {
                    labelEl.innerHTML = `<strong>${inputEl.files.length} files selected</strong>`;
                } else {
                    labelEl.innerHTML = `<strong>${inputEl.files[0].name}</strong>`;
                }
                zone.style.borderColor = "var(--success)";
            }
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            zone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                zone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            zone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                zone.classList.remove('dragover');
            }, false);
        });

        zone.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const dataTransfer = new DataTransfer();
                for (let i = 0; i < files.length; i++) {
                    dataTransfer.items.add(files[i]);
                }
                inputEl.files = dataTransfer.files;

                if (isMultiple) {
                    labelEl.innerHTML = `<strong>${files.length} files selected</strong>`;
                } else {
                    labelEl.innerHTML = `<strong>${files[0].name}</strong>`;
                }
                zone.style.borderColor = "var(--success)";
            }
        });
    }

    setupDropZone('objDropZone', objInput, objText, false);
    setupDropZone('mtlDropZone', mtlInput, mtlText, false);
    setupDropZone('imgDropZone', imgInput, imgText, true);

    convertBtn.addEventListener('click', async () => {
        const objFile = objInput.files[0];
        const mtlFile = mtlInput.files[0];
        const textureFiles = Array.from(imgInput.files);

        if (!objFile) {
            alert("Please select at least an OBJ file.");
            return;
        }

        const startTime = performance.now();
        statusDiv.textContent = "Processing files...";
        convertBtn.disabled = true;
        viewerContainer.style.display = "none";

        try {
            const textureMap = new Map();
            textureFiles.forEach(file => {
                textureMap.set(file.name.toLowerCase(), URL.createObjectURL(file));
            });

            const manager = new THREE.LoadingManager();
            manager.setURLModifier((url) => {
                const fileName = url.split('/').pop().toLowerCase();
                if (textureMap.has(fileName)) {
                    return textureMap.get(fileName);
                }
                return url;
            });

            let materials = null;

            if (mtlFile) {
                statusDiv.textContent = "Parsing materials...";
                const mtlTextContent = await mtlFile.text();
                const mtlLoader = new MTLLoader(manager);
                materials = mtlLoader.parse(mtlTextContent, '');
                materials.preload();
            }

            statusDiv.textContent = "Loading 3D model...";
            const objTextContent = await objFile.text();
            const objLoader = new OBJLoader(manager);
            if (materials) {
                objLoader.setMaterials(materials);
            }
            const object = objLoader.parse(objTextContent);

            statusDiv.textContent = "Optimizing materials and transparency...";
            const factor = parseFloat(brightnessInput.value);
            const makeUnlit = unlitToggle.checked;
            const makeDoubleSided = doubleSideToggle.checked;

            object.traverse((child) => {
                if (child.isMesh && child.material) {
                    const processMat = (mat) => {
                        const isTransparent = mat.transparent || (mat.opacity < 1.0);
                        const matOpacity = mat.opacity !== undefined ? mat.opacity : 1.0;

                        let newMat;
                        if (makeUnlit) {
                            newMat = new THREE.MeshBasicMaterial({
                                map: mat.map,
                                color: mat.color.clone().multiplyScalar(factor),
                                transparent: isTransparent,
                                opacity: matOpacity,
                                side: makeDoubleSided ? THREE.DoubleSide : THREE.FrontSide
                            });
                        } else {
                            newMat = new THREE.MeshStandardMaterial({
                                map: mat.map,
                                color: mat.color.clone().multiplyScalar(factor),
                                roughness: 0.5,
                                metalness: 0.1,
                                transparent: isTransparent,
                                opacity: matOpacity,
                                side: makeDoubleSided ? THREE.DoubleSide : THREE.FrontSide
                            });
                        }
                        return newMat;
                    };

                    if (Array.isArray(child.material)) {
                        child.material = child.material.map(m => processMat(m));
                    } else {
                        child.material = processMat(child.material);
                    }
                }
            });

            if (rotateToggle.checked) {
                object.rotation.x = -Math.PI / 2;
            }

            statusDiv.textContent = "Generating GLB...";
            const exporter = new GLTFExporter();
            
            exporter.parse(
                object,
                (gltf) => {
                    const blob = new Blob([gltf], { type: 'application/octet-stream' });
                    generatedBlobUrl = URL.createObjectURL(blob);
                    outputFileName = objFile.name.replace(/\.obj$/i, '') + '_GE.glb';

                    const elapsedTime = ((performance.now() - startTime) / 1000).toFixed(2);

                    modelViewer.src = generatedBlobUrl;
                    viewerContainer.style.display = "block";

                    statusDiv.textContent = `✨ Success! Converted in ${elapsedTime}s & loaded below.`;
                    convertBtn.disabled = false;
                },
                (error) => {
                    statusDiv.textContent = "Export error: " + error;
                    convertBtn.disabled = false;
                },
                { binary: true }
            );

        } catch (err) {
            statusDiv.textContent = "Error: " + err.message;
            convertBtn.disabled = false;
        }
    });

    downloadBtn.addEventListener('click', () => {
        if (!generatedBlobUrl) return;
        const link = document.createElement('a');
        link.href = generatedBlobUrl;
        link.download = outputFileName;
        link.click();
    });
</script>

</body>
</html>
